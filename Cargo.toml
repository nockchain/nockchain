# [lints.clippy]
# pedantic = { level = "warn", priority = -1 }
# restriction = { level = "warn", priority = -2 }

[profile.dev]
# Keep normal target/debug artifacts inspectable, but use release-like runtime
# settings so prover/miner debug runs do not behave like unoptimized builds.
opt-level = 3
debug = "full"
strip = "none"
lto = "thin"
codegen-units = 1
incremental = false
debug-assertions = false
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3
debug = "full"
codegen-units = 1

[profile.test]
inherits = "dev"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
debug = 1

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
debug = 1

# Memory profiling with bytehound. Keeps release optimizations but emits full debug info.
[profile.bytehound]
inherits = "release"
debug = 2

[profile.bytehound.package."*"]
opt-level = 3
codegen-units = 1
debug = 2
