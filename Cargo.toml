[workspace]
members = ["crates/ai-pow", "crates/ai-pow-miner", "crates/ai-pow-jets", "crates/ai-pow-zk", "crates/bridge", "crates/bridge-dev", "crates/equix-latency", "crates/habit", "crates/hoon", "crates/hoonc", "crates/kernels", "crates/kernels/bridge", "crates/kernels/dumb", "crates/kernels/miner", "crates/kernels/nockchain-peek", "crates/kernels/roswell", "crates/kernels/wallet", "crates/nockapp", "crates/nockapp-grpc", "crates/nockapp-grpc-proto", "crates/nockchain", "crates/nockchain-api", "crates/nockchain-bridge-sequencer", "crates/nockchain-e2e", "crates/nockchain-explorer-tui", "crates/nockchain-libp2p-io", "crates/nockchain-math", "crates/nockchain-mining-common", "crates/nockchain-peek", "crates/nockchain-testkit", "crates/nockchain-types", "crates/nockchain-wallet", "crates/nockup", "crates/nockvm/rust/ibig", "crates/nockvm/rust/murmur3", "crates/nockvm/rust/nockvm", "crates/nockvm/rust/nockvm_macros", "crates/noun-serde", "crates/noun-serde-derive", "crates/raw-tx-checker", "crates/roswell", "crates/wallet-tx-builder", "crates/zk-pow-miner", "crates/zkvm-jetpack"]
# `pearl/` is the Rust 2024 upstream reference implementation, vendored for
# cross-comparison only. `crates/plonky3-recursion/` is the vendored recursion
# substrate (C1/M-S3), an independent workspace kept on the same core
# Plonky3 pin as `ai-pow-zk`. Both are excluded so their nested Cargo.tomls
# don't conflict with ours; C2 wires Tip5 into the vendored tree.
exclude = ["pearl", "crates/plonky3-recursion"]
resolver = "2"

[workspace.package]
version = "0.1.15"
edition = "2021"

# Lints enforced workspace-wide so `cargo`/`cargo clippy`/rust-analyzer flag these
# locally and in-editor, instead of only at the CI `cargo-clippy` / bazel `make
# lint` gate. Mirrors exactly the flags applied in those gates:
#   .bazelrc:            -Dwarnings  -Dclippy::unwrap_used  -Aclippy::missing_safety_doc
#   open/.gitlab-ci.yml: -Dclippy::unwrap_used  -Aclippy::missing_safety_doc  -Dwarnings
#   Makefile lint-local: (same cargo flags)
# Each member crate opts in with `[lints] workspace = true`. The `warnings` group
# is given priority = -1 so the explicit clippy allow (missing_safety_doc) still
# wins, matching the `-A...` after `-D warnings` ordering on the CLI.
[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
missing_safety_doc = "allow"
# Allowed for the nightly-2026-04-03 toolchain bump: the newer clippy newly flags these on
# pre-existing code across the tree (nockapp, nockup, the verifier crates, ...). Deferred to a
# dedicated cleanup pass; kept in sync with the `-A` clippy flags in `.bazelrc`.
result_large_err = "allow"
unnecessary_cast = "allow"
unnecessary_sort_by = "allow"
collapsible_match = "allow"
manual_checked_ops = "allow"
while_let_loop = "allow"
# Style/complexity lints that are pervasive and idiomatic in the numeric / AIR /
# STARK-prover code (explicit trace-index loops, prover functions with many
# statement parameters, complex circuit-prover data types). Fixing them would hurt
# clarity or force churny struct-wrapping without changing behaviour.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# Pedantic style lints where the existing form is deliberate: mnemonic hex
# constants (`0xC0FFEE_42`) and nested indented doc-list structure in the AIR
# constraint documentation.
unusual_byte_groupings = "allow"
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
# Noun decoders dispatch on tag cords via `x if x == tas!(b"..")` guards (the
# `tas!` macro cannot appear in pattern position), and some driver enums carry
# one intentionally-large proof/artifact variant.
redundant_guards = "allow"
large_enum_variant = "allow"

