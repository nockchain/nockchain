# Nous gen2 baseline scenario
#
# Verifies that two nodes using the mandatory gen2 protocol can sync and
# produce blocks.

name: "nous_gen2_enabled"
seed: 21

nodes:
  - id: "node-a"
    binary: "${NOCKCHAIN_BIN_NEW}"
    fakenet: true
    new_state: true
    mine: true
    mining_pkh: "9yPePjfWAdUnzaQKyxcRXKRa5PpUzKKEwtpECBZsUYt9Jd7egSDEWoV"
    fakenet_pow_len: 2
    fakenet_log_difficulty: 1
    fakenet_v1_phase: 3
    no_default_peers: true

  - id: "node-b"
    binary: "${NOCKCHAIN_BIN_NEW}"
    fakenet: true
    new_state: true
    fakenet_pow_len: 2
    fakenet_log_difficulty: 1
    fakenet_v1_phase: 3
    no_default_peers: true
    peer_from:
      - node: "node-a"
        listen: "/ip4/127.0.0.1/udp/${BASE_P2P_PORT}/quic-v1"

steps:
  - action: start_nodes
    ids: ["node-a"]

  - action: wait_for_grpc
    node: "node-a"
    timeout_ms: 300000

  - action: wait_for_height
    node: "node-a"
    height: 5
    timeout_ms: 120000

  - action: start_nodes
    ids: ["node-b"]

  - action: wait_for_grpc
    node: "node-b"
    timeout_ms: 300000

  - action: wait_for_height
    node: "node-b"
    height: 5
    timeout_ms: 120000

asserts:
  - assert: req_res_generation
    node: "node-b"
    peer: "node-a"
    generation: gen2
    timeout_ms: 30000
  - assert: heads_equal
    nodes: ["node-a", "node-b"]
    timeout_ms: 30000
