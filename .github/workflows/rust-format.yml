name: "Check rust formatting"
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ensure rustfmt is installed and setup problem matcher
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      # Workspace-only formatting; `cargo fmt --all` also walks local path
      # dependencies such as vendored proof-system crates.
      - name: Rustfmt Check
        run: cargo fmt --check
