name: AI-PoW inference image

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ai-pow-inference-image.yml"
      - "docker/Dockerfile.ai-pow-inference"
      - "docker/ai-pow-inference-container-entrypoint"
      - "docker/ai-pow-inference-health"
      - "docker/pearl-vllm-0.27.1.patch"
      - "docker/ai-pow-inference-run"
      - "docker/ai-pow-inference-seed-model"
      - "crates/ai-pow/**"
      - "crates/ai-pow-miner/Cargo.toml"
      - "crates/ai-pow-miner/build.rs"
      - "crates/ai-pow-miner/src/**"
      - "crates/ai-pow-miner/vllm-plugin/**"
      - "crates/ai-pow-miner-cuda/**"
      - "crates/ai-pow-zk/**"
      - "crates/nockapp-grpc-proto/**"
      - "scripts/benchmark-gemma4-openai.py"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-pow-inference-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nockchain/nockchain-ai-pow-inference

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Python dependency wheels
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai-pow-inference
          platforms: linux/amd64
          target: python-deps-builder
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-python
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-python,mode=max
          provenance: false

      - name: Cache Rust and CUDA binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai-pow-inference
          platforms: linux/amd64
          target: rust-builder
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-rust
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-rust,mode=max
          provenance: false

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai-pow-inference
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-python
            type=registry,ref=${{ env.IMAGE }}:buildcache-rust
            type=registry,ref=${{ env.IMAGE }}:buildcache-runtime
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-runtime,mode=max
          provenance: false
