name: Build and test (Bazel)

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: bazel-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Bazel's action cache only restores exact compile actions. Honk's
      # content-addressed products also accelerate changed Hoon sources.
      - name: Restore Honk Nockasm cache
        uses: actions/cache@v4
        with:
          path: .honk-cache
          key: honk-nockasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            honk-nockasm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - Cargo.lock
            - .bazelversion

      # Use the same absolute path as setup-bazel so its prior caches can seed
      # this cache; the path is part of GitHub's cache format version.
      - name: Locate Bazel action cache
        run: echo "BAZEL_DISK_CACHE=$HOME/.cache/bazel-disk" >> "$GITHUB_ENV"

      # Refresh the action cache on every revision, including source-only changes.
      # setup-bazel's BUILD-file key otherwise keeps restoring an old snapshot.
      - name: Restore Bazel action cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-action-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-action-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion') }}-
            setup-bazel-1-linux-x64-disk-build-test-

      - name: Configure Bazel action cache
        run: printf '\nbuild --disk_cache=%s\n' "$BAZEL_DISK_CACHE" >> "$HOME/.bazelrc"

      - name: Build release binaries and run unit tests
        run: |
          bazel test \
            --define=kernel_compiler=honk \
            //crates/hoon:hoon \
            //crates/hoonc:hoonc_bin \
            //crates/nockup:nockup \
            //crates/nockchain:nockchain \
            //crates/nockchain-wallet:nockchain-wallet \
            //crates/nockvm/rust/nockvm:nockvm_unit_tests \
            //crates/hoonc:hoonc_unit_tests \
            //crates/nockchain:nockchain_unit_tests \
            //crates/nockchain-wallet:nockchain-wallet_unit_tests

      - name: Save Honk Nockasm products
        run: bazel run --define=kernel_compiler=honk //assets/native:save_honk_cache_ci
