[package]
name = "nockchain-mcp"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Read-only, code-mode MCP server for Nockchain gRPC APIs"

[[bin]]
name = "nockchain-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
libc.workspace = true
nockapp.workspace = true
nockapp-grpc-proto = { workspace = true, features = ["client"] }
nockchain-math.workspace = true
nockchain-types.workspace = true
nockvm.workspace = true
prost.workspace = true
prost-reflect.workspace = true
rmcp.workspace = true
rustls.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
