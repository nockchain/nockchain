[package]
name = "zk-pow-miner"
version.workspace = true
edition.workspace = true
description = "Standalone ZK PoW block miner with CUDA V5 search and Serf STARK proving."
publish = false

[features]
default = []
cuda = []

[lib]
name = "zk_pow_miner"
path = "src/lib.rs"

[[bin]]
name = "zk-pow-mine"
path = "src/bin/zk_pow_mine.rs"

[[bin]]
name = "zk-pow-cuda-bench"
path = "src/bin/zk_pow_cuda_bench.rs"
required-features = ["cuda"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
ibig = { workspace = true }
kernels-open-miner = { workspace = true }
nockapp = { workspace = true }
nockapp-grpc = { workspace = true }
nockchain-math = { workspace = true }
nockchain-mining-common = { workspace = true }
nockvm = { workspace = true }
nockvm_macros = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "ansi"] }
zkvm-jetpack = { workspace = true }

[dev-dependencies]
gnort = { workspace = true }
noun-serde = { workspace = true }
once_cell = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
