[package]
name = "ai-pow-miner-cuda"
version = "0.1.15"
edition = "2021"
description = "CUDA search backend and standalone AI-PoW miner."
publish = false

# This package is excluded from Nockchain's root workspace so normal Rust
# builds never resolve CUDA toolchain or driver dependencies.
[workspace]

[[bin]]
name = "ai-pow-mine-cuda"
path = "src/main.rs"

[dependencies]
ai-pow = { path = "../ai-pow", features = ["zk"] }
ai-pow-miner = { path = "../ai-pow-miner", features = ["node"] }
anyhow = "1"
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
