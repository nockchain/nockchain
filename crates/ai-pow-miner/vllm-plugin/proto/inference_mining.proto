syntax = "proto3";

package nockchain.ai_pow.v1;

service InferenceMiningService {
  rpc RegisterRuntime(RegisterRuntimeRequest) returns (RegisterRuntimeResponse);
  rpc GetMiningJob(GetMiningJobRequest) returns (MiningJob);
  rpc NotifyWork(NotifyWorkRequest) returns (NotifyWorkResponse);
  rpc SubmitOpenedBlock(stream OpenedBlockPart) returns (SubmitOpenedBlockResponse);
  rpc GetStatus(GetStatusRequest) returns (InferenceMiningStatus);
}

message RegisterRuntimeRequest {
  uint32 protocol_version = 1;
  bytes checkpoint_content_digest = 2;
  bytes cuda_device_uuid = 3;
  uint32 process_id = 4;
}

message RegisterRuntimeResponse {
  bytes runtime_id = 1;
  uint32 protocol_version = 2;
}

message GetMiningJobRequest {
  bytes runtime_id = 1;
}

message MiningJob {
  uint64 candidate_generation = 1;
  bytes incomplete_header = 2;
  bytes effective_target_le = 3;
  uint32 certificate_version = 4;
  bytes mining_config = 5;
}

enum WorkPhase {
  WORK_PHASE_UNSPECIFIED = 0;
  WORK_PHASE_STARTED = 1;
  WORK_PHASE_FINISHED = 2;
  WORK_PHASE_FAILED = 3;
}

message NotifyWorkRequest {
  bytes runtime_id = 1;
  uint64 work_id = 2;
  WorkPhase phase = 3;
  uint32 layer = 4;
  uint32 token_count = 5;
  uint32 common_dim = 6;
  uint32 output_dim = 7;
  string error = 8;
}

message NotifyWorkResponse {
  uint64 work_id = 1;
  uint32 active_work_items = 2;
}

enum OpenedTensor {
  OPENED_TENSOR_UNSPECIFIED = 0;
  OPENED_TENSOR_A = 1;
  OPENED_TENSOR_B_TRANSPOSED = 2;
  OPENED_TENSOR_ROUTING = 3;
}

message OpenedBlockMetadata {
  bytes runtime_id = 1;
  uint64 candidate_generation = 2;
  uint64 work_id = 3;
  repeated uint32 a_row_indices = 4;
  repeated uint32 b_column_indices = 5;
  bytes noise_seed_a = 6;
  bytes noise_seed_b = 7;
  uint32 noise_rank = 8;
  uint32 a_rows = 9;
  uint32 b_columns = 10;
  uint32 common_dim = 11;
  uint32 extranonce = 12;
}

message OpenedTensorChunk {
  OpenedTensor tensor = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message OpenedBlockPart {
  oneof part {
    OpenedBlockMetadata metadata = 1;
    OpenedTensorChunk tensor_chunk = 2;
  }
}

message SubmitOpenedBlockResponse {
  bool accepted = 1;
  string detail = 2;
}

message GetStatusRequest {}

enum SchedulerMode {
  SCHEDULER_MODE_UNSPECIFIED = 0;
  SCHEDULER_MODE_IDLE_MINING = 1;
  SCHEDULER_MODE_INFERENCE_MINING = 2;
}

message InferenceMiningStatus {
  SchedulerMode mode = 1;
  uint32 active_work_items = 2;
  uint64 idle_batches = 3;
  uint64 inference_batches = 4;
  uint64 candidate_generation = 5;
  uint64 opened_blocks_received = 6;
  bool production_enabled = 7;
  bool node_connected = 8;
}
