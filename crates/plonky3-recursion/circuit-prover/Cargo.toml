[package]
name = "p3-circuit-prover"
description = "Plonky3 native support for recursive proof composition"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3-recursion"
homepage = "https://github.com/Plonky3/Plonky3-recursion"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
hashbrown = "0.16.1"
p3-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-blake3 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-circle = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-circuit = { path = "../circuit", version = "0.1.0" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-fri = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-lookup = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-poseidon1-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-poseidon1-circuit-air = { path = "../poseidon1-circuit-air", version = "0.1.0" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-poseidon2-circuit-air = { path = "../poseidon2-circuit-air", version = "0.1.0" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-tip5-circuit-air = { path = "../tip5-circuit-air", version = "0.1.0" }
p3-uni-stark = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
rand = { version = "0.10.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
strum = { version = "0.28.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
unroll = { version = "0.1.5", default-features = false }

[dev-dependencies]
p3-batch-stark = { git = "https://github.com/Plonky3/Plonky3.git", rev = "83ec3062e42a0b556798d22fa0ed0ee09c81c5e1" }
p3-test-utils = { path = "../test-utils", version = "0.1.0" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand = { version = "0.10.0", default-features = false }
tracing-forest = { version = "0.3.1", features = ["smallvec"] }
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["alloc", "std", "env-filter"] }

[features]
# Rayon-parallel prover. `p3-maybe-rayon/parallel` is the central
# switch: when ON, every Plonky3 crate that imports
# `p3_maybe_rayon::prelude::*` (uni-stark, dft, fri, batch-stark,
# merkle-tree, …) uses real rayon parallel iterators; when OFF
# they fall back to a serial mimic. The per-crate `parallel`
# convenience features just forward to that same switch — we
# enumerate them explicitly so Cargo's feature unification is
# obvious. **Default ON 2026-05-21** to match ai-pow-zk's prover
# default; serial = `--no-default-features`. Proofs are
# bit-identical between serial and parallel (deterministic,
# index-ordered reductions).
default = ["parallel"]
parallel = [
    "p3-maybe-rayon/parallel",
    # Upstream Plonky3 (the central switch + prover-side parallelism)
    "p3-uni-stark/parallel",
    "p3-batch-stark/parallel",
    "p3-dft/parallel",
    "p3-poseidon1-air/parallel",
    "p3-poseidon2-air/parallel",
    # In-tree (Plonky3-recursion-vendored) AIR trace-gen parallelism
    "p3-poseidon1-circuit-air/parallel",
    "p3-poseidon2-circuit-air/parallel",
    "p3-tip5-circuit-air/parallel",
]
# Path B inventory profiling — passthrough to p3-circuit's profiling
# feature so `CircuitBuilder::scope_op_counts()` is callable. Used by
# the M-S5b Path B Stage B0 inventory tool for per-scope source
# attribution. Off by default.
profiling = ["p3-circuit/profiling"]

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
rust_2024_incompatible_pat = "warn"

[lints.rustdoc]
all = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"
