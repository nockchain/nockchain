[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-pages"
version = "0.1.0"
description = "Publish nockchain SOL sweep pages"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1",
]

[project.scripts]
publish-sweep = "bench_pages.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
